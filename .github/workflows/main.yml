name: Refresh CyberPulse Feed

on:
  schedule:
    - cron: '0 */6 * * *' # S'exécute toutes les 6 heures (vous pouvez ajuster)
  workflow_dispatch: # Permet de le lancer manuellement depuis l'onglet Actions

jobs:
  update-feed:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Indispensable pour permettre au bot de pousser les modifications

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Exécution du script de mise à jour
        run: python scripts/update_feeds.py

      - name: Commit et Push des modifications
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/veille.json
          git diff-index --quiet HEAD || (git commit -m "Mise à jour automatique des flux de veille" && git push)
